# Railway configuration for the SCI backend.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Migrations run after the build and before the new version takes traffic.
# They belong here rather than in the build because the build has no database
# to connect to, and rather than in the start command because every replica
# would then race to migrate the same database.
preDeployCommand = "npx prisma migrate deploy"

startCommand = "node dist/main.js"

healthcheckPath = "/api/v1/health"
healthcheckTimeout = 120

# A failed deploy rolls back rather than leaving the service down.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
